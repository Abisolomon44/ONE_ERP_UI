<app-master-page
  [config]="config"
  [data]="rows()"
  [userModel]="userModel"
  [showEntry]="showEntry()"
  [loading]="loading()"
  [saving]="saving()"
  (createClick)="createRow()"
  (editClick)="editRow($event)"
  (deleteClick)="deleteRow($event)"
  (saveClick)="save()"
  (cancelClick)="cancel()"
  (refreshClick)="refresh()"
  (actionClick)="onAction($event)">
</app-master-page>
