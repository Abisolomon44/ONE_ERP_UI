<div class="prp">
  <nav class="rp-tabs">
    @for (c of configs; track c.id) {
      <button class="rp-tab" type="button" [class.active]="active() === c.id" (click)="setActive(c.id)">
        <lucide-icon [name]="c.icon" [size]="15"></lucide-icon>
        <span>{{ c.label }}</span>
      </button>
    }
  </nav>

  <section class="rp-content">
    @for (c of configs; track c.id) {
      <div class="prp-pane" [class.hidden]="active() !== c.id">
        <app-purchase-report-screen [reportId]="c.id"></app-purchase-report-screen>
      </div>
    }
  </section>
</div>
