<div class="workspace-page">

  <!-- Header -->
  <div class="workspace-header">
    <div class="workspace-title">
      <div class="workspace-icon">
        <i-lucide [name]="workspace.icon" [size]="30"></i-lucide>
      </div>
      <div>
        <h2>{{ workspace.title }}</h2>
        <p>{{ workspace.description }}</p>
      </div>
    </div>

    <div class="workspace-header-actions">
      <div class="search-box">
        <i-lucide name="Search" [size]="15" class="input-prefix"></i-lucide>
        <input
          class="input search-input has-prefix"
          placeholder="Search..."
        />
      </div>

      <button class="icon-btn" type="button">
        <i-lucide name="Bell" [size]="17"></i-lucide>
      </button>

      <button class="icon-btn" type="button">
        <i-lucide name="CircleUserRound" [size]="17"></i-lucide>
      </button>
    </div>
  </div><!-- Quick Actions -->
<div class="workspace-actions">
  @for (action of workspace.quickActions; track action.id) {

    <a
      class="btn btn-{{ action.color }}"
      [routerLink]="action.route">

      @if (action.icon) {
        <i-lucide
          [name]="action.icon"
          [size]="16">
        </i-lucide>
      }

      {{ action.title }}

    </a>

  }
</div>

<!-- Shortcut Cards -->
<div class="shortcut-grid">
  @for (card of workspace.shortcuts; track card.id) {

    <a
      class="shortcut-card"
      [routerLink]="card.route">

      <div class="shortcut-icon">
        @if (card.icon) {
          <i-lucide
            [name]="card.icon"
            [size]="28">
          </i-lucide>
        } @else {
          <i-lucide
            name="Circle"
            [size]="28">
          </i-lucide>
        }
      </div>

      <h5>{{ card.title }}</h5>

      <p>{{ card.description }}</p>

   

    </a>

  }
</div>
