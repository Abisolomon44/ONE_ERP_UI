<div class="page change-password-page">
  <div class="cp-card">
    <div class="cp-header">
      <span class="cp-icon"><i-lucide name="key-round" [size]="20"></i-lucide></span>
      <div>
        <h1 class="cp-title">Change Password</h1>
        <div class="cp-sub">Update your account password.</div>
      </div>
    </div>

    <form (ngSubmit)="submit()" style="display:block">
      <base-input label="Current Password" type="password" icon="lock" id="currentPassword"
        [(value)]="currentPassword" autocomplete="current-password"
        [error]="currentPasswordFieldError()" [allowedPattern]="passwordCharPattern"></base-input>
      <base-input label="New Password" type="password" icon="key-round" id="newPassword"
        [(value)]="newPassword" autocomplete="new-password"
        [error]="newPasswordFieldError()" [allowedPattern]="passwordCharPattern"></base-input>
      <base-input label="Confirm New Password" type="password" icon="key-round" id="confirmNewPassword"
        [(value)]="confirmPassword" autocomplete="new-password"
        [error]="confirmPasswordFieldError()" [allowedPattern]="passwordCharPattern"></base-input>

      <ul class="pwd-requirements">
        <li [class.ok]="requirements().minLength">✓ Minimum 8 characters</li>
        <li [class.ok]="requirements().hasUppercase">✓ Uppercase</li>
        <li [class.ok]="requirements().hasLowercase">✓ Lowercase</li>
        <li [class.ok]="requirements().hasNumber">✓ Number</li>
        <li [class.ok]="requirements().hasSpecial">✓ Special character</li>
        <li [class.ok]="requirements().noSpaces">✓ No spaces</li>
      </ul>

      <div class="cp-actions">
        <base-button variant="outline" [disabled]="loading()" (click)="cancel()">Cancel</base-button>
        <base-button type="submit" [loading]="loading()" [disabled]="!canSubmit()">
          {{ loading() ? 'Changing…' : 'Change Password' }}
        </base-button>
      </div>
    </form>
  </div>
</div>
