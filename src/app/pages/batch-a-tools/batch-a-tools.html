<section class="tools"><h1>Batch A Tools</h1>
    <div class="card"><h2>Variant Attributes / Values</h2><div class="form">
        <input type="number" [(ngModel)]="variantId" placeholder="Variant ID" (change)="loadAttributes()">
        <input [(ngModel)]="attributeName" placeholder="Attribute name"><input [(ngModel)]="attributeValue" placeholder="Attribute value"><button (click)="addAttribute()">Add attribute</button></div><table><tr><th>Name</th><th>Value</th><th></th></tr><tr *ngFor="let a of attributes()"><td>{{a.attributeName}}</td><td>{{a.attributeValue}}</td><td><button class="danger" (click)="deleteAttribute(a.id)">Delete</button></td></tr></table></div><div class="card"><h2>Barcode Label Generation / Printing</h2><div class="form"><input [(ngModel)]="productName" placeholder="Product name"><input [(ngModel)]="barcode" placeholder="Barcode"><select [(ngModel)]="barcodeType"><option>CODE128</option><option>EAN13</option><option>UPC</option></select><button (click)="addLabel()">Add label</button><button (click)="print()">Print labels</button></div><div class="labels"><div class="label" *ngFor="let l of labels()"><strong>{{l.productName}}</strong><div class="bars">|||| ||| |||| |</div><span>{{l.barcode}}</span></div></div></div></section>
