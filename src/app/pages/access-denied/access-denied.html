<div class="access-denied">
  <div class="card">
    <div class="shield">
      <i-lucide name="shield-alert" [size]="40"></i-lucide>
    </div>
    <h1>Access Denied</h1>
    <p class="hint">
      You do not have permission to view this screen. If you believe this is a
      mistake, contact your administrator.
    </p>
    <a routerLink="/dashboard">
      <base-button variant="primary" icon="home">Go to Dashboard</base-button>
    </a>
  </div>
</div>
